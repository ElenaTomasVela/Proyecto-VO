name: deepcell
services:
  deepcell-tf:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities:
                - gpu
    stdin_open: true
    tty: true
    ports:
      - 8888:8888
    volumes:
      - ./:/notebooks
      - ./data:/data
    image: vanvalenlab/deepcell-tf:latest-gpu
